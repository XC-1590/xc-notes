<!DOCTYPE html><br/><html lang="zh-CN"><br/><head><br/><meta charset="UTF-8"><br/><meta name="viewport" content="width=device-width, initial-scale=1.0"><br/><title>xc-notes</title><br/><style><br/>:root{--bg:#0d0d0d;--card:#141414;--text:#b0b0b0;--accent:#7aa2f7;--line:#222;--danger:#f7768e}<br/>*{margin:0;padding:0;box-sizing:border-box}<br/>body{background:var(--bg);color:var(--text);font-family:"SF Mono","Fira Code","JetBrains Mono",monospace;max-width:680px;margin:0 auto;padding:2rem 1.5rem;line-height:1.7}<br/>h1{color:var(--accent);font-size:1.1rem;margin-bottom:2rem;font-weight:400;letter-spacing:0.05em}<br/>h2{color:var(--accent);font-size:0.85rem;margin:2rem 0 0.6rem;padding-bottom:0.35rem;border-bottom:1px solid var(--line);font-weight:400;cursor:pointer;user-select:none;letter-spacing:0.04em;transition:opacity .15s}<br/>h2:hover{opacity:.7}<br/>.entry{padding:.45rem 0;border-bottom:1px dotted #1e1e1e;font-size:.82rem;display:flex;justify-content:space-between;align-items:flex-start}<br/>.entry .time{color:#555;margin-right:.7rem;white-space:nowrap;font-size:.78rem}<br/>.entry .del{color:var(--danger);cursor:pointer;font-size:.7rem;opacity:0;transition:opacity .15s}<br/>.entry:hover .del{opacity:1}<br/>.todo{display:flex;align-items:flex-start;gap:.45rem;padding:.3rem 0;font-size:.82rem}<br/>.todo input[type=checkbox]{accent-color:var(--accent);margin-top:.2rem;cursor:pointer}<br/>.todo.done span{text-decoration:line-through;color:#444}<br/>.todo .del{color:var(--danger);cursor:pointer;font-size:.7rem;opacity:0;margin-left:auto;transition:opacity .15s}<br/>.todo:hover .del{opacity:1}<br/>.locked{text-align:center;padding:5rem 1rem;color:#2a2a2a;font-size:.85rem}<br/>.input-row{display:flex;gap:.4rem;margin:.5rem 0;flex-wrap:wrap}<br/>.input-row input,.input-row textarea{flex:1;min-width:100px;background:var(--card);border:1px solid var(--line);color:var(--text);padding:.4rem .55rem;font-family:inherit;font-size:.82rem;border-radius:3px;transition:border-color .15s}<br/>.input-row input:focus,.input-row textarea:focus{outline:none;border-color:var(--accent)}<br/>.input-row button{background:var(--accent);border:none;color:#0d0d0d;padding:.4rem .85rem;font-family:inherit;font-size:.78rem;border-radius:3px;cursor:pointer;font-weight:600;transition:opacity .15s}<br/>.input-row button:hover{opacity:.8}<br/>.hide{display:none}<br/>.status{font-size:.68rem;margin-left:.4rem}<br/>.status.ok{color:#9ece6a}<br/>.status.err{color:var(--danger)}<br/>#key-setup{background:var(--card);border:1px solid var(--line);padding:1rem;border-radius:4px;margin-bottom:1.5rem}<br/>#key-setup p{font-size:.78rem;color:#777;margin-bottom:.5rem}<br/>#key-setup input{width:100%;background:#0d0d0d;border:1px solid var(--line);color:var(--text);padding:.4rem .6rem;font-family:inherit;font-size:.8rem;border-radius:3px;margin-bottom:.5rem}<br/>#key-setup button{background:var(--accent);border:none;color:#0d0d0d;padding:.4rem 1rem;font-family:inherit;font-size:.78rem;border-radius:3px;cursor:pointer;font-weight:600}<br/></style><br/></head>
