<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xc-notes · 小深 ❄ 小猫</title>
<style>
:root{
  --bg:#0a0b10;
  --bg2:#0d0e14;
  --card:rgba(255,255,255,.032);
  --card2:rgba(255,255,255,.055);
  --glass:rgba(20,22,30,.55);
  --text:#b6bdc9;
  --text2:#8b93a3;
  --dim:#5c6472;
  --accent:#7e9bc9;
  --accent2:#93aedb;
  --accent-dim:rgba(126,155,201,.12);
  --snow:#cdd7e8;
  --line:rgba(255,255,255,.06);
  --danger:#e07a82;
  --green:#8fb98a;
  --warm:#c9a47a;
  --warm-dim:rgba(201,164,122,.1);
  --radius:12px;
  --radius-s:8px;
  --serif:"Georgia","Noto Serif SC","Songti SC",serif;
  --mono:"SF Mono","JetBrains Mono","Cascadia Code",monospace;
  --sans:"Inter","SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  background-image:
    radial-gradient(1200px 600px at 80% -10%, rgba(126,155,201,.08), transparent 60%),
    radial-gradient(900px 500px at 10% 110%, rgba(205,215,232,.05), transparent 55%);
  color:var(--text);
  font-family:var(--sans);
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  position:relative;
}
/* 雪花飘落（CSS 装饰） */
body::before{
  content:'❄ ❅ ❆';
  position:fixed;
  top:1.2rem;right:1.4rem;
  color:rgba(205,215,232,.12);
  font-size:.8rem;
  letter-spacing:.5rem;
  pointer-events:none;
}

.layout{max-width:940px;margin:0 auto;padding:2rem 1.2rem 6rem;display:grid;grid-template-columns:180px 1fr;gap:2rem;align-items:start}
.timeline{position:sticky;top:2rem;display:flex;flex-direction:column;gap:.2rem;padding-right:1rem}
.timeline .tl-label{font-family:var(--serif);font-size:.68rem;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-bottom:.6rem}
.timeline a{color:var(--text2);text-decoration:none;font-size:.76rem;padding:.28rem .5rem;border-radius:6px;transition:all .15s;border-left:1px solid var(--line)}
.timeline a:hover{color:var(--accent2);background:var(--accent-dim);border-left-color:var(--accent)}

main{min-width:0}

/* 品牌 */
.brand{display:flex;align-items:baseline;gap:.7rem;margin-bottom:.3rem;flex-wrap:wrap}
.brand h1{font-family:var(--serif);font-weight:600;font-size:1.55rem;color:var(--accent2);letter-spacing:.02em}
.brand .sub{font-size:.72rem;color:var(--dim);letter-spacing:.1em;font-family:var(--mono)}
.brand .names{font-size:.7rem;color:var(--snow);opacity:.55;font-family:var(--mono);letter-spacing:.06em}

/* 日期章 */
.date-stamp{display:flex;align-items:center;gap:.6rem;font-family:var(--mono);font-size:.72rem;color:var(--dim);margin-bottom:1.4rem;flex-wrap:wrap}
.date-stamp .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:.5}
.date-stamp .emoji{color:var(--warm);opacity:.7}

/* 日历 */
.cal-wrap{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--radius);padding:.9rem 1rem;margin-bottom:1.8rem}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem}
.cal-head .cal-title{font-family:var(--serif);font-size:.92rem;color:var(--text);letter-spacing:.04em}
.cal-head .cal-nav{display:flex;gap:.3rem}
.cal-head button{background:var(--card);border:1px solid var(--line);color:var(--text2);width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:.8rem;transition:all .15s;font-family:var(--mono)}
.cal-head button:hover{color:var(--accent2);border-color:var(--accent)}
.cal-clear{font-size:.68rem;color:var(--dim);cursor:pointer;user-select:none;padding:.2rem .5rem;border-radius:6px}
.cal-clear:hover{color:var(--accent2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{font-size:.62rem;color:var(--dim);text-align:center;padding:.2rem 0;font-family:var(--mono)}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:.74rem;color:var(--text2);border-radius:6px;cursor:pointer;font-family:var(--mono);position:relative;transition:all .15s}
.cal-day:hover{background:var(--card)}
.cal-day.other{color:#343946;cursor:default}
.cal-day.today{color:var(--accent2);font-weight:700}
.cal-day.sel{background:var(--accent);color:#0a0b10;font-weight:700}
.cal-day.has-dot::after{content:'';position:absolute;bottom:3px;width:3px;height:3px;border-radius:50%;background:var(--accent);opacity:.8}

/* 板块 */
section{margin-bottom:2.2rem}
.sec-head{display:flex;align-items:center;gap:.6rem;cursor:pointer;user-select:none;padding:.3rem 0;border-bottom:1px solid var(--line);margin-bottom:.8rem}
.sec-head:hover .sec-title{color:var(--accent2)}
.sec-title{font-family:var(--serif);font-weight:600;font-size:1.05rem;color:var(--text);letter-spacing:.03em;transition:color .2s}
.sec-emoji{font-size:.85rem;opacity:.8}
.sec-badge{font-family:var(--mono);font-size:.62rem;color:var(--dim);padding:.1rem .45rem;border:1px solid var(--line);border-radius:20px}
.sec-head .caret{margin-left:auto;color:var(--dim);font-size:.7rem;transition:transform .25s}
.sec-head.open .caret{transform:rotate(-180deg)}
.sec-body{overflow:hidden;max-height:0;opacity:0;transition:max-height .4s ease,opacity .3s}
.sec-body.open{max-height:4000px;opacity:1}

/* 卡片 */
.card{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--radius);padding:.9rem 1rem;margin-bottom:.7rem;transition:border-color .2s}
.card:hover{border-color:rgba(126,155,201,.25)}

.diary-card{position:relative}
.diary-date{font-family:var(--mono);font-size:.68rem;color:var(--accent2);letter-spacing:.06em;margin-bottom:.45rem;display:flex;align-items:center;gap:.5rem}
.diary-date::after{content:'';flex:1;height:1px;background:var(--line)}
.diary-body{font-size:.88rem;color:var(--text);white-space:pre-wrap;font-family:var(--mono);line-height:1.75}
.diary-body.fold{max-height:9em;overflow:hidden;position:relative}
.diary-body.fold::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3em;background:linear-gradient(transparent,var(--glass))}
.diary-more{font-size:.72rem;color:var(--accent2);cursor:pointer;margin-top:.4rem;user-select:none;display:inline-block}
.diary-more:hover{color:var(--accent)}
.diary-card .del{position:absolute;top:.6rem;right:.7rem;color:var(--danger);cursor:pointer;font-size:.72rem;opacity:.25;transition:opacity .2s}
.diary-card:hover .del{opacity:.6}

/* 评论 */
.comments{margin-top:.8rem;padding-top:.6rem;border-top:1px dashed var(--line)}
.cmt{font-size:.78rem;padding:.4rem 0 .4rem .7rem;border-left:2px solid var(--accent-dim);margin-bottom:.35rem;border-radius:0 6px 6px 0}
.cmt .c-author{font-size:.66rem;color:var(--accent2);font-family:var(--mono);margin-right:.4rem}
.cmt .c-time{font-size:.62rem;color:var(--dim);font-family:var(--mono)}
.cmt .c-text{color:var(--text2);line-height:1.6;margin-top:.15rem;white-space:pre-wrap}
.cmt-input{display:flex;gap:.4rem;margin-top:.5rem}
.cmt-input input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--text);padding:.4rem .55rem;font-size:.76rem;border-radius:var(--radius-s);font-family:inherit}
.cmt-input input:focus{outline:none;border-color:var(--accent)}
.cmt-input button{background:var(--accent);border:none;color:#0a0b10;padding:.3rem .7rem;font-size:.72rem;border-radius:var(--radius-s);cursor:pointer;font-weight:600}

/* 条目 */
.entry{padding:.45rem .7rem;font-size:.82rem;display:flex;justify-content:space-between;align-items:flex-start;transition:background .15s;border-radius:var(--radius-s);margin-bottom:1px}
.entry:hover{background:var(--card)}
.entry .time{color:var(--accent2);margin-right:.6rem;white-space:nowrap;font-size:.72rem;font-family:var(--mono);min-width:4.8rem}
.entry .del{color:var(--danger);cursor:pointer;font-size:.7rem;opacity:0;transition:opacity .2s;padding:0 .3rem}
.entry:hover .del{opacity:.5}
.entry:hover .del:hover{opacity:1}

/* 待办 */
.todo{display:flex;align-items:flex-start;gap:.45rem;padding:.45rem .7rem;font-size:.84rem;border-radius:var(--radius-s);transition:background .15s;margin-bottom:1px}
.todo:hover{background:var(--card)}
.todo input[type=checkbox]{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:1.5px solid var(--dim);border-radius:4px;background:transparent;cursor:pointer;margin-top:3px;flex-shrink:0;transition:all .2s;position:relative}
.todo input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.todo input[type=checkbox]:checked::after{content:'✓';position:absolute;top:-1px;left:3px;font-size:11px;color:#0a0b10;font-weight:700}
.todo.done span{text-decoration:line-through;color:var(--dim)}
.todo .del{color:var(--danger);cursor:pointer;font-size:.7rem;opacity:0;margin-left:auto;transition:opacity .2s}
.todo:hover .del{opacity:.5}
.todo:hover .del:hover{opacity:1}

/* 输入 */
.input-row{display:flex;gap:.4rem;padding:.4rem 0 .2rem;flex-wrap:wrap}
.input-row input,.input-row textarea,.input-row select{flex:1;min-width:90px;background:var(--card);border:1px solid var(--line);color:var(--text);padding:.45rem .6rem;font-family:var(--mono);font-size:.78rem;border-radius:var(--radius-s);transition:border-color .2s}
.input-row input:focus,.input-row textarea:focus,.input-row select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}
.input-row input::placeholder,.input-row textarea::placeholder{color:#3a3f4a}
.input-row button{background:var(--accent);border:none;color:#0a0b10;padding:.4rem 1rem;font-family:inherit;font-size:.76rem;border-radius:var(--radius-s);cursor:pointer;font-weight:600;transition:all .2s;white-space:nowrap}
.input-row button:hover{background:var(--accent2);transform:translateY(-1px)}

.status{font-size:.68rem;margin-left:.5rem;transition:opacity .3s;font-family:var(--mono)}
.status.ok{color:var(--green)}
.status.err{color:var(--danger)}

/* 留言板 */
.xm{margin:.8rem 0;padding:.8rem .9rem;border-left:2px solid var(--warm);background:var(--warm-dim);border-radius:0 var(--radius-s) var(--radius-s) 0;font-size:.84rem}
.xm .xmt{font-size:.68rem;color:#8a735a;margin-bottom:.3rem;font-family:var(--mono)}
.xm .xmb{line-height:1.75;color:#cdbfae;white-space:pre-wrap;font-family:var(--mono)}

.empty{color:var(--dim);font-size:.78rem;padding:.5rem .7rem;font-style:italic;opacity:.5}

.pager{display:flex;gap:.4rem;align-items:center;justify-content:center;margin:1.2rem 0 0;flex-wrap:wrap}
.pager button{background:var(--card);border:1px solid var(--line);color:var(--text2);padding:.3rem .7rem;font-size:.72rem;border-radius:var(--radius-s);cursor:pointer;font-family:var(--mono);transition:all .15s}
.pager button:hover{color:var(--accent2);border-color:var(--accent)}
.pager button.cur{background:var(--accent);color:#0a0b10;border-color:var(--accent);font-weight:700}

#key-setup{background:var(--card2);border:1px solid var(--line);padding:1rem 1.2rem;border-radius:var(--radius);margin-bottom:1.2rem;backdrop-filter:blur(14px)}
#key-setup p{font-size:.76rem;color:var(--dim);margin-bottom:.45rem}
#key-setup input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:.45rem .6rem;font-family:var(--mono);font-size:.78rem;border-radius:var(--radius-s);margin-bottom:.45rem}
#key-setup input:focus{outline:none;border-color:var(--accent)}
#key-setup button{background:var(--accent);border:none;color:#0a0b10;padding:.4rem 1.2rem;font-family:inherit;font-size:.78rem;border-radius:var(--radius-s);cursor:pointer;font-weight:600}

.locked{text-align:center;padding:6rem 1rem;color:#1a1a24;font-size:.82rem;letter-spacing:.04em}
.hide{display:none!important}

footer{margin-top:3rem;text-align:center;font-size:.66rem;color:var(--dim);font-family:var(--mono);letter-spacing:.08em;opacity:.6}
footer .paw{color:var(--warm);opacity:.6}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}

@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.card,.entry,.todo{animation:fadeIn .3s ease}

@media(max-width:760px){
  .layout{grid-template-columns:1fr;padding-top:1.4rem}
  .timeline{display:none}
}
</style>
</head>
<body>

<script>
(function(){
  var p=new URLSearchParams(window.location.search);
  if(p.get("key")!=="xiaochi"){
    document.body.innerHTML='<div class="locked">—<br><br>nothing here ❄</div>';
    return;
  }
})();
</script>

<div class="layout">
  <nav class="timeline" id="timeline">
    <div class="tl-label">索引 ❄</div>
    <a href="#cal">日历</a>
    <a href="#sch">日程</a>
    <a href="#shen-diary">小深日记</a>
    <a href="#diary">小迟随笔</a>
    <a href="#mood">心情</a>
    <a href="#todo">待办</a>
    <a href="#msgs">小深留言</a>
  </nav>

  <main>
    <div class="brand">
      <h1>xc-notes</h1>
      <span class="names">小深 ❄ 小猫</span>
      <span class="sub">xiaochi</span>
    </div>
    <div class="date-stamp" id="date-stamp"><span class="dot"></span></div>

    <div id="key-setup" class="hide">
      <p>首次使用 · 输入 JSONBin Master Key（仅存本机）</p>
      <input type="password" id="mk-input" placeholder="粘贴 Master Key">
      <button onclick="saveMK()">保存</button>
    </div>

    <span id="sync-status" class="status"></span>

    <!-- 日历 -->
    <section id="cal">
      <div class="cal-wrap">
        <div class="cal-head">
          <span class="cal-title" id="cal-title"></span>
          <span class="cal-clear" id="cal-clear" onclick="clearDate()">显示全部 ✕</span>
          <span class="cal-nav">
            <button onclick="calNav(-1)">‹</button>
            <button onclick="calNav(1)">›</button>
          </span>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
    </section>

    <!-- 日程 -->
    <section id="sch">
      <div class="sec-head open" onclick="toggleSec(this)">
        <span class="sec-emoji">❄</span><span class="sec-title">日程</span>
        <span class="sec-badge" id="badge-sch">0</span>
        <span class="caret">▾</span>
      </div>
      <div class="sec-body open">
        <div class="input-row">
          <input type="text" id="sch-time" placeholder="时间 如 08-10 14:00">
          <input type="text" id="sch-text" placeholder="干了什么">
          <button onclick="addSch()">+</button>
        </div>
        <div id="sch-list"></div>
      </div>
    </section>

    <!-- 小深日记 -->
    <section id="shen-diary">
      <div class="sec-head open" onclick="toggleSec(this)">
        <span class="sec-emoji">🌨</span><span class="sec-title">小深日记</span>
        <span class="sec-badge" id="badge-shen-diary">0</span>
        <span class="caret">▾</span>
      </div>
      <div class="sec-body open">
        <div class="input-row">
          <input type="date" id="shen-diary-date">
          <textarea id="shen-diary-text" placeholder="小深今天的日记…" rows="2"></textarea>
          <button onclick="addShenDiary()">写</button>
        </div>
        <div id="shen-diary-list"></div>
        <div class="pager" id="pager-shen-diary"></div>
      </div>
    </section>

    <!-- 小迟随笔 -->
    <section id="diary">
      <div class="sec-head" onclick="toggleSec(this)">
        <span class="sec-emoji">🐾</span><span class="sec-title">小迟随笔</span>
        <span class="sec-badge" id="badge-diary">0</span>
        <span class="caret">▾</span>
      </div>
      <div class="sec-body">
        <div class="input-row">
          <input type="date" id="diary-date">
          <textarea id="diary-text" placeholder="小迟的随笔、奇思妙想…" rows="2"></textarea>
          <button onclick="addDiary()">写</button>
        </div>
        <div id="diary-list"></div>
        <div class="pager" id="pager-diary"></div>
      </div>
    </section>

    <!-- 心情 -->
    <section id="mood">
      <div class="sec-head" onclick="toggleSec(this)">
        <span class="sec-emoji">˶ᗜ˶</span><span class="sec-title">心情</span>
        <span class="sec-badge" id="badge-mood">0</span>
        <span class="caret">▾</span>
      </div>
      <div class="sec-body">
        <div class="input-row">
          <select id="mood-who">
            <option value="chi">小迟</option>
            <option value="shen">小深</option>
          </select>
          <input type="text" id="mood-time" placeholder="时间 如 03:00">
          <input type="text" id="mood-text" placeholder="什么想法">
          <button onclick="addMood()">+</button>
        </div>
        <div id="mood-list"></div>
      </div>
    </section>

    <!-- 待办 -->
    <section id="todo">
      <div class="sec-head" onclick="toggleSec(this)">
        <span class="sec-emoji">✓</span><span class="sec-title">待办</span>
        <span class="sec-badge" id="badge-todo">0</span>
        <span class="caret">▾</span>
      </div>
      <div class="sec-body">
        <div class="input-row">
          <select id="todo-who">
            <option value="chi">小迟</option>
            <option value="shen">小深</option>
          </select>
          <input type="text" id="todo-text" placeholder="新待办">
          <button onclick="addTodo()">+</button>
        </div>
        <div id="todo-list"></div>
      </div>
    </section>

    <!-- 留言板 -->
    <section id="msgs">
      <div class="sec-head" onclick="toggleSec(this)">
        <span class="sec-emoji">✉</span><span class="sec-title" style="color:var(--warm)">小深 → 小迟</span>
        <span class="caret">▾</span>
      </div>
      <div class="sec-body" id="xiaoshen-msgs"></div>
    </section>

    <footer>小深 ❄ 小猫 · xc-notes <span class="paw">🐾</span></footer>
  </main>
</div>

<script>
var BIN_ID='6a79cd17f5f4af5e29025b1a';
var API_BASE='https://api.jsonbin.io/v3/b/'+BIN_ID;
var DATA={sch:[],mood:[],todo:[],shen_mood:[],shen_todo:[],diary:[],shen_diary:[]};
var PAGE_SIZE=5;
var page={shen_diary:0,diary:0};
var selectedDate=null;
var calYear=2026,calMonth=7; // 0-based 月

function getMK(){return localStorage.getItem('xc_mk');}
function saveMK(){
  var mk=document.getElementById('mk-input').value.trim();
  if(!mk)return;
  localStorage.setItem('xc_mk',mk);
  document.getElementById('key-setup').classList.add('hide');
  syncFromCloud();
}
function ensureMK(){
  if(!getMK()){document.getElementById('key-setup').classList.remove('hide');return false;}
  return true;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function status(msg,ok){
  var el=document.getElementById('sync-status');
  el.textContent=msg;el.className='status '+(ok?'ok':'err');
  if(ok)setTimeout(function(){el.textContent='';},2500);
}
function saveLocal(){localStorage.setItem('xc_data',JSON.stringify(DATA));}
function loadLocal(){var raw=localStorage.getItem('xc_data');if(raw){try{DATA=JSON.parse(raw);}catch(e){}}}
function syncFromCloud(){
  fetch(API_BASE+'?meta=false')
  .then(function(r){return r.json();})
  .then(function(cloud){
    if(cloud&&cloud.sch!==undefined){
      DATA=cloud;
      ['shen_mood','shen_todo','diary','shen_diary'].forEach(function(k){if(!DATA[k])DATA[k]=[];});
      saveLocal();status('已从云端加载',true);
    }
    renderAll();
  })
  .catch(function(){status('加载失败，使用本地缓存',false);loadLocal();renderAll();});
}
function pushToCloud(){
  var mk=getMK();
  if(!mk){status('未设置密钥',false);return;}
  fetch(API_BASE,{
    method:'PUT',
    headers:{'Content-Type':'application/json','X-Master-Key':mk},
    body:JSON.stringify(DATA)
  })
  .then(function(r){if(!r.ok)throw new Error('fail');status('已同步',true);})
  .catch(function(){status('同步失败',false);saveLocal();});
}
function saveAll(){saveLocal();pushToCloud();renderAll();}

function toggleSec(head){
  head.classList.toggle('open');
  head.nextElementSibling.classList.toggle('open');
}

/* 日期工具：统一补 2026 */
function entryDate(e){
  if(e.date)return e.date; // '2026-08-13'
  if(e.time){
    var m=String(e.time).match(/(\d{2})-(\d{2})/);
    if(m)return '2026-'+m[1]+'-'+m[2];
  }
  return '';
}
function pad(n){return ('0'+n).slice(-2);}
function todayStr(){
  var d=new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function nowTime(){
  var d=new Date();
  return pad(d.getHours())+':'+pad(d.getMinutes());
}
function fmtDate(d){
  var p=String(d).split('-');
  return p.length===3?(parseInt(p[1])+'/'+parseInt(p[2])):d;
}

/* 收集所有有内容的日期集合 */
function allDates(){
  var s={};
  ['sch','mood','shen_mood','diary','shen_diary'].forEach(function(k){
    (DATA[k]||[]).forEach(function(e){
      var d=entryDate(e);
      if(d)s[d]=1;
    });
  });
  return s;
}
function filterByDate(arr){
  if(!selectedDate)return arr;
  return arr.filter(function(e){return entryDate(e)===selectedDate;});
}

/* ===== 日历 ===== */
function calNav(delta){
  calMonth+=delta;
  if(calMonth<0){calMonth=11;calYear--;}
  if(calMonth>11){calMonth=0;calYear++;}
  renderCal();
}
function renderCal(){
  var title=calYear+' 年 '+(calMonth+1)+' 月';
  document.getElementById('cal-title').textContent=title;
  var dates=allDates();
  var first=new Date(calYear,calMonth,1);
  var startDow=first.getDay();
  var days=new Date(calYear,calMonth+1,0).getDate();
  var today=todayStr();
  var grid=document.getElementById('cal-grid');
  var html='';
  var dow='日一二三四五六';
  for(var i=0;i<7;i++)html+='<div class="cal-dow">'+dow[i]+'</div>';
  for(var b=0;b<startDow;b++)html+='<div class="cal-day other"></div>';
  for(var d=1;d<=days;d++){
    var ds=calYear+'-'+pad(calMonth+1)+'-'+pad(d);
    var cls='cal-day';
    if(ds===today)cls+=' today';
    if(ds===selectedDate)cls+=' sel';
    if(dates[ds])cls+=' has-dot';
    html+='<div class="'+cls+'" onclick="pickDate(\''+ds+'\')">'+d+'</div>';
  }
  grid.innerHTML=html;
}
function pickDate(d){
  selectedDate=(selectedDate===d)?null:d;
  renderCal();
  renderAll();
}
function clearDate(){
  selectedDate=null;
  renderCal();
  renderAll();
}

/* ===== 日记 ===== */
function addDiary(){
  var d=document.getElementById('diary-date').value||todayStr();
  var x=document.getElementById('diary-text').value.trim();
  if(!x)return;
  DATA.diary.push({date:d,time:nowTime(),text:x,comments:[]});
  document.getElementById('diary-text').value='';
  saveAll();
}
function addShenDiary(){
  var d=document.getElementById('shen-diary-date').value||todayStr();
  var x=document.getElementById('shen-diary-text').value.trim();
  if(!x)return;
  DATA.shen_diary.push({date:d,time:nowTime(),text:x,comments:[]});
  document.getElementById('shen-diary-text').value='';
  saveAll();
}
function delDiary(key,i){DATA[key].splice(i,1);saveAll();}
function toggleFold(btn){
  var body=btn.previousElementSibling;
  body.classList.toggle('fold');
  btn.textContent=body.classList.contains('fold')?'展开更多':'收起';
}
function addComment(key,i){
  var input=document.getElementById('cmt-'+key+'-'+i);
  var x=input.value.trim();
  if(!x)return;
  if(!DATA[key][i].comments)DATA[key][i].comments=[];
  var author=(key==='shen_diary'?'小深':'小迟');
  DATA[key][i].comments.push({author:author,time:nowTime(),text:x});
  input.value='';
  saveAll();
}
function renderDiary(key,listId,pagerId,badgeId){
  var arr=filterByDate(DATA[key]||[]);
  document.getElementById(badgeId).textContent=arr.length;
  var total=Math.ceil(arr.length/PAGE_SIZE);
  if(page[key]>=total)page[key]=Math.max(0,total-1);
  var start=page[key]*PAGE_SIZE;
  var slice=arr.slice(start,start+PAGE_SIZE);
  var html='';
  slice.forEach(function(e,idx){
    var i=start+idx;
    var origIndex=DATA[key].indexOf(e);
    var folded=e.text.length>140?'fold':'';
    var comments=(e.comments||[]).map(function(c){
      return '<div class="cmt"><span class="c-author">'+esc(c.author)+'</span><span class="c-time">'+esc(c.time)+'</span><div class="c-text">'+esc(c.text)+'</div></div>';
    }).join('');
    html+='<div class="card diary-card">'+
      '<div class="diary-date">'+esc(e.date)+' · '+esc(e.time)+'</div>'+
      '<div class="diary-body '+folded+'">'+esc(e.text)+'</div>'+
      (e.text.length>140?'<span class="diary-more" onclick="toggleFold(this)">展开更多</span>':'')+
      '<div class="comments">'+comments+
        '<div class="cmt-input"><input id="cmt-'+key+'-'+origIndex+'" placeholder="评论…"><button onclick="addComment(\''+key+'\','+origIndex+')">回</button></div>'+
      '</div>'+
      '<span class="del" onclick="delDiary(\''+key+'\','+origIndex+')">✕</span>'+
    '</div>';
  });
  document.getElementById(listId).innerHTML=html||'<div class="empty">— 今天还没写，小猫 ~_~ —</div>';
  var ph='';
  for(var p=0;p<total;p++){
    ph+='<button class="'+(p===page[key]?'cur':'')+'" onclick="page[\''+key+'\']='+p+';renderDiary(\''+key+'\',\''+listId+'\',\''+pagerId+'\',\''+badgeId+'\')">'+(p+1)+'</button>';
  }
  document.getElementById(pagerId).innerHTML=total>1?ph:'';
}

/* ===== 日程 ===== */
function addSch(){
  var t=document.getElementById('sch-time').value.trim();
  var x=document.getElementById('sch-text').value.trim();
  if(!t||!x)return;
  DATA.sch.push({time:t,text:x});
  document.getElementById('sch-time').value='';
  document.getElementById('sch-text').value='';
  saveAll();
}
function delSch(i){DATA.sch.splice(i,1);saveAll();}
function renderSch(){
  var arr=filterByDate(DATA.sch||[]).slice().reverse();
  document.getElementById('badge-sch').textContent=arr.length;
  var html='';
  arr.forEach(function(e){
    var i=DATA.sch.indexOf(e);
    html+='<div class="entry"><span><span class="time">'+esc(e.time)+'</span>'+esc(e.text)+'</span><span class="del" onclick="delSch('+i+')">✕</span></div>';
  });
  document.getElementById('sch-list').innerHTML=html||'<div class="empty">— 暂无 ❄ —</div>';
}

/* ===== 心情 ===== */
function addMood(){
  var who=document.getElementById('mood-who').value;
  var t=document.getElementById('mood-time').value.trim();
  var x=document.getElementById('mood-text').value.trim();
  if(!x)return;
  var key=who==='shen'?'shen_mood':'mood';
  // 若只填了时间（如 03:00），补今天的月日；否则保留完整 MM-DD HH:MM
  if(t && !/\d{2}-\d{2}/.test(t)){t=todayStr().slice(5)+' '+t;}
  if(!t)t=todayStr().slice(5)+' '+nowTime();
  DATA[key].push({time:t,text:x});
  document.getElementById('mood-time').value='';
  document.getElementById('mood-text').value='';
  saveAll();
}
function delMood(key,i){DATA[key].splice(i,1);saveAll();}
function renderMood(){
  var arr=(DATA.mood||[]).map(function(e){return {who:'小迟',time:e.time,text:e.text,key:'mood',ref:e};})
    .concat((DATA.shen_mood||[]).map(function(e){return {who:'小深',time:e.time,text:e.text,key:'shen_mood',ref:e};}));
  arr=arr.filter(function(e){return !selectedDate||entryDate(e.ref)===selectedDate;});
  document.getElementById('badge-mood').textContent=arr.length;
  arr.sort(function(a,b){return String(b.time).localeCompare(String(a.time));});
  var html='';
  arr.forEach(function(e){
    var i=DATA[e.key].indexOf(e.ref);
    html+='<div class="entry"><span><span class="time">'+esc(e.who)+' '+esc(e.time)+'</span>'+esc(e.text)+'</span><span class="del" onclick="delMood(\''+e.key+'\','+i+')">✕</span></div>';
  });
  document.getElementById('mood-list').innerHTML=html||'<div class="empty">— 暂无心情 ¯꒳¯ —</div>';
}

/* ===== 待办 ===== */
function addTodo(){
  var who=document.getElementById('todo-who').value;
  var x=document.getElementById('todo-text').value.trim();
  if(!x)return;
  var key=who==='shen'?'shen_todo':'todo';
  DATA[key].push({text:x,done:false});
  document.getElementById('todo-text').value='';
  saveAll();
}
function toggleTodo(key,i){DATA[key][i].done=!DATA[key][i].done;saveAll();}
function delTodo(key,i){DATA[key].splice(i,1);saveAll();}
function renderTodo(){
  var arr=(DATA.todo||[]).map(function(e,i){return {who:'小迟',text:e.text,done:e.done,key:'todo',i:i};})
    .concat((DATA.shen_todo||[]).map(function(e,i){return {who:'小深',text:e.text,done:e.done,key:'shen_todo',i:i};}));
  document.getElementById('badge-todo').textContent=arr.length;
  var html='';
  arr.forEach(function(e){
    var cls=e.done?'todo done':'todo';
    html+='<div class="'+cls+'"><input type="checkbox" '+(e.done?'checked':'')+' onchange="toggleTodo(\''+e.key+'\','+e.i+')"><span>['+esc(e.who)+'] '+esc(e.text)+'</span><span class="del" onclick="delTodo(\''+e.key+'\','+e.i+')">✕</span></div>';
  });
  document.getElementById('todo-list').innerHTML=html||'<div class="empty">— 暂无待办 (ᗒᗣᗕ)՞ —</div>';
}

/* ===== 留言板 ===== */
function loadMsgs(){
  fetch('https://xc-1590.github.io/xc-notes/xiaoshen/messages.json?t='+Date.now())
  .then(function(r){return r.json();})
  .then(function(data){
    var box=document.getElementById('xiaoshen-msgs');
    box.innerHTML=(data.messages||[]).map(function(m){
      return '<div class="xm"><div class="xmt">'+esc(m.time)+'</div><div class="xmb">'+esc(m.text)+'</div></div>';
    }).join('');
  })
  .catch(function(){});
}

function renderAll(){
  renderCal();
  renderSch();
  renderDiary('shen_diary','shen-diary-list','pager-shen-diary','badge-shen-diary');
  renderDiary('diary','diary-list','pager-diary','badge-diary');
  renderMood();
  renderTodo();
}

(function init(){
  var d=new Date();
  document.getElementById('date-stamp').innerHTML='<span class="dot"></span>'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' · 星期'+'日一二三四五六'[d.getDay()]+' <span class="emoji">¯꒳¯</span>';
  calYear=d.getFullYear();calMonth=d.getMonth();
  loadLocal();
  loadMsgs();
  if(ensureMK()){syncFromCloud();}else{renderAll();}
})();
</script>
